# Lint, typecheck and test the workspace on every push.
#
# `build` is not a gate of its own: `api`, `cli` and `web` resolve `@falcon/core` through its emitted
# `dist/*.d.ts`, so nothing typechecks, lints or tests until core is built.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root `packageManager` field - no second pin to drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `better-sqlite3` and `esbuild` need their install scripts, allow-listed in `pnpm-workspace.yaml`.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # ESLint (flat config at the repo root, type-aware); `--max-warnings=0`, so a warning fails too.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
