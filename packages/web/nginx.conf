# C3PO's server: static SPA + a reverse proxy to the onboard computer.
# The /api prefix is the same one packages/web/vite.config.ts proxies in dev, so the client's relative
# fetches ("/api/universe", "/api/odds") are identical in both environments.

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames under /assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a redeploy keeps serving the old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # No URI part on proxy_pass, so the original /api/... path reaches Fastify unrewritten.
    location /api/ {
        proxy_pass       http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # empire.json uploads; nginx's 1m default would reject a large sighting list with a bare 413.
        client_max_body_size 4m;
    }

    # Single-page app: anything not on disk is the client's business, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
